<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support | PourAware</title>

  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f7f8;
      --card: #ffffff;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --border: #e5e5e7;
      --link: #0071e3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111113;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #a1a1a6;
        --border: #38383a;
        --link: #2997ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        Arial, sans-serif;
      line-height: 1.65;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 38px;
    }

    .app-name {
      color: var(--secondary);
      font-size: 18px;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <article class="card">

      <div class="app-name">PourAware</div>
      <h1>Support</h1>

      <p>
        Need help with PourAware, have feedback, or want to report an issue?
      </p>

      <p>
        Contact us at:
        <a href="mailto:pouraware@gmail.com">pouraware@gmail.com</a>
      </p>

      <p>
        When reporting an issue, it may help to include your device model,
        iOS or iPadOS version, and a brief description of what happened.
      </p>

      <footer>
        &copy; 2026 Wei Du. All rights reserved.
      </footer>

    </article>
  </main>
</body>
</html>
